name: Lint

on:
  push:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26.x"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci

      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
